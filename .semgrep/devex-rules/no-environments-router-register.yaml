rules:
    - id: no-environments-router-register
      message: |
          Direct `environments_router.register(...)` is banned. `/api/projects/` is
          the canonical path; `/api/environments/` exists only as a backward-compat
          alias for clients that integrated against it before the project↔environment
          split was rolled back.

          For new team-nested endpoints, register directly under `projects_router`:

              projects_router.register(
                  r"my_thing", MyThingViewSet, "project_my_thing", ["team_id"],
              )

          If you also need the `/api/environments/` alias (e.g. existing SDK
          integrations call it), use `register_team_nested_viewset(...)` — it
          registers both routes and the env one is auto-marked `deprecated: true`
          in the generated OpenAPI schema.

          Background: see the docstring on
          `register_grandfathered_environment_nested_viewset` in
          `posthog/api/__init__.py`. After the rollback there's no legitimate
          reason to register a new endpoint env-only; doing so means the project
          path is never generated by Orval and consumers are pinned to the
          deprecated surface.

          If you have a genuine edge case (e.g. an endpoint where the env-side
          and project-side need different parent lookups), add
          `# nosemgrep: no-environments-router-register` on the line with a
          short comment explaining why the helper doesn't fit.
      severity: ERROR
      languages: [python]
      paths:
          include:
              - 'posthog/api/__init__.py'
      patterns:
          - pattern: environments_router.register(...)
          # Exempt registrations inside the helper function bodies themselves —
          # those are the implementation, not call sites.
          - pattern-not-inside: |
                def $FUNC(...):
                    ...
      metadata:
          category: best-practice
          subcategory:
              - audit
